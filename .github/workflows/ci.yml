name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (numpy and pyyaml are only needed for training/tests, never for the Lambda itself)
        run: pip install -e ".[test]"
      - name: Unit tests
        run: pytest -v --cov=immune --cov-report=term-missing
